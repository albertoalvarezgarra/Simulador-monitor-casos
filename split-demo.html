<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador Philips DFM100 - Modo Doble Pantalla (Demo & Pruebas)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090c10;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      flex-direction: column;
    }
    .top-demo-bar {
      height: 38px;
      background: #141b24;
      border-bottom: 1px solid #222d3d;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      color: #94a3b8;
      font-size: 13px;
      font-weight: 600;
    }
    .top-demo-bar strong {
      color: #00ff66;
    }
    .top-demo-links {
      display: flex;
      gap: 12px;
    }
    .top-demo-links a {
      color: #64b5f6;
      text-decoration: none;
      font-size: 12px;
    }
    .split-container {
      display: flex;
      flex: 1;
      width: 100%;
      height: calc(100% - 38px);
    }
    .left-tablet-frame {
      flex: 1.1;
      height: 100%;
      border-right: 3px solid #1e2838;
      position: relative;
    }
    .right-mobile-frame {
      flex: 1;
      min-width: 460px;
      height: 100%;
      background: #06090e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px;
    }
    .phone-mockup {
      width: 100%;
      height: 100%;
      border-radius: 18px;
      border: 4px solid #243447;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <div class="top-demo-bar">
    <div>
      <span>PHILIPS DFM100 SIMULATOR — <strong>MODO DUAL</strong> — <small style="color: #64748b;">Propiedad de Alberto Á. Garra</small></span>
    </div>
    <div class="top-demo-links">
      <a href="index.html">← Volver al Inicio</a>
      <a href="student.html?room=DEMO" target="_blank">Abrir Tablet Completa ↗</a>
      <a href="instructor.html?room=DEMO" target="_blank">Abrir Móvil Completo ↗</a>
    </div>
  </div>

  <div class="split-container">
    <!-- PANEL IZQUIERDO: TABLET DEL ALUMNO -->
    <div class="left-tablet-frame">
      <iframe src="student.html?room=DEMO" id="tabletIframe" title="Pantalla del Alumno"></iframe>
    </div>

    <!-- PANEL DERECHO: MÓVIL DEL INSTRUCTOR -->
    <div class="right-mobile-frame">
      <div class="phone-mockup">
        <iframe src="instructor.html?room=DEMO" id="mobileIframe" title="Móvil del Instructor"></iframe>
      </div>
    </div>
  </div>

</body>
</html>
